<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travels & Booking | APEX</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .scrollbar-none::-webkit-scrollbar { display: none; }
        .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease-in-out; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .map-bg {
            background-image: url('https://images.unsplash.com/photo-1524661135-423995f22d0b?auto=format&fit=crop&q=80');
            background-size: cover;
            background-position: center;
        }

        .pulse-dot {
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 15px rgba(37, 211, 102, 0); }
            100% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(37, 211, 102, 0); }
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { apex: { purple: '#6C3FC5', purplelight: '#EDE9FF' } }, fontFamily: { sans: ['Inter', 'sans-serif'] } }
            }
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => {
                el.classList.remove('bg-apex-purple', 'text-white', 'shadow-md');
                el.classList.add('bg-white', 'text-gray-500');
            });
            
            document.getElementById('content-' + tabId).classList.add('active');
            document.getElementById('tab-' + tabId).classList.remove('bg-white', 'text-gray-500');
            document.getElementById('tab-' + tabId).classList.add('bg-apex-purple', 'text-white', 'shadow-md');
        }

        function locateMe() {
            const input = document.getElementById('cab-pickup');
            input.value = "Fetching live location...";
            
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const { latitude, longitude } = position.coords;
                        // Mocking reverse geocoding for UI display
                        setTimeout(() => {
                            input.value = "Your Location (" + latitude.toFixed(2) + ", " + longitude.toFixed(2) + ")";
                        }, 800);
                    },
                    (error) => {
                        input.value = "Location access denied";
                    }
                );
            } else {
                input.value = "Geolocation not supported";
            }
        }

        function bookCab() {
            const btn = document.getElementById('cab-btn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Confirming...';
            btn.disabled = true;
            
            setTimeout(() => {
                btn.innerHTML = '<i class="fa-solid fa-check mr-2"></i> Cab Confirmed!';
                btn.classList.replace('bg-gray-900', 'bg-green-600');
                btn.classList.replace('hover:bg-black', 'hover:bg-green-700');
                
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                    btn.classList.replace('bg-green-600', 'bg-gray-900');
                    btn.classList.replace('hover:bg-green-700', 'hover:bg-black');
                }, 3000);
            }, 2000);
        }

        function simulateSearch(btnElement, type) {
            const originalText = btnElement.innerHTML;
            btnElement.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Searching ' + type + '...';
            btnElement.disabled = true;
            
            setTimeout(() => {
                btnElement.innerHTML = '<i class="fa-solid fa-check mr-2"></i> Results Found!';
                btnElement.classList.add('bg-green-600', 'hover:bg-green-700');
                btnElement.classList.remove('bg-purple-600', 'hover:bg-purple-700', 'bg-orange-600', 'hover:bg-orange-700', 'bg-red-600', 'hover:bg-red-700');
                
                setTimeout(() => {
                    btnElement.innerHTML = originalText;
                    btnElement.disabled = false;
                    btnElement.classList.remove('bg-green-600', 'hover:bg-green-700');
                    if(type === 'Flights') btnElement.classList.add('bg-purple-600', 'hover:bg-purple-700');
                    if(type === 'Buses') btnElement.classList.add('bg-orange-600', 'hover:bg-orange-700');
                    if(type === 'Trains') btnElement.classList.add('bg-red-600', 'hover:bg-red-700');
                }, 3000);
            }, 2500);
        }
    </script>
</head>
<body class="font-sans antialiased bg-slate-900 flex justify-center">
<div class="w-full max-w-md bg-gray-50 min-h-screen relative shadow-2xl overflow-x-hidden border-x border-slate-800">
    
    <!-- HEADER -->
    <div class="absolute top-0 z-50 w-full bg-white/90 backdrop-blur-md border-b border-gray-100 px-4 py-3 flex items-center justify-between shadow-sm">
        <div class="flex items-center gap-3">
            <a href="index.html" class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center text-gray-600 hover:bg-gray-200 transition-colors">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <h1 class="font-black text-lg text-gray-900">APEX Travels</h1>
        </div>
        <button class="w-8 h-8 rounded-full bg-purple-50 text-purple-600 flex items-center justify-center">
            <i class="fa-solid fa-clock-rotate-left"></i>
        </button>
    </div>

    <!-- TABS -->
    <div class="absolute top-[60px] z-50 w-full px-4 pt-2 pb-2">
        <div class="flex gap-2 overflow-x-auto scrollbar-none">
            <button id="tab-cab" onclick="switchTab('cab')" class="tab-btn bg-apex-purple text-white shadow-md px-4 py-2 rounded-full text-[11px] font-bold whitespace-nowrap flex items-center gap-2 transition-all">
                <i class="fa-solid fa-taxi"></i> Cab
            </button>
            <button id="tab-bus" onclick="switchTab('bus')" class="tab-btn bg-white text-gray-500 px-4 py-2 rounded-full text-[11px] font-bold whitespace-nowrap flex items-center gap-2 transition-all">
                <i class="fa-solid fa-bus"></i> Bus
            </button>
            <button id="tab-train" onclick="switchTab('train')" class="tab-btn bg-white text-gray-500 px-4 py-2 rounded-full text-[11px] font-bold whitespace-nowrap flex items-center gap-2 transition-all">
                <i class="fa-solid fa-train"></i> Train
            </button>
            <button id="tab-flight" onclick="switchTab('flight')" class="tab-btn bg-white text-gray-500 px-4 py-2 rounded-full text-[11px] font-bold whitespace-nowrap flex items-center gap-2 transition-all">
                <i class="fa-solid fa-plane"></i> Flight
            </button>
        </div>
    </div>

    <!-- TAB CONTENTS -->

    <!-- CAB SECTION (Map UI) -->
    <div id="content-cab" class="tab-content active h-screen relative">
        <!-- Map Background -->
        <div class="absolute inset-0 map-bg z-0 opacity-80"></div>
        <div class="absolute inset-0 bg-gradient-to-t from-gray-900/40 to-transparent z-0"></div>
        
        <!-- Live Location Pin -->
        <div class="absolute top-1/3 left-1/2 -translate-x-1/2 -translate-y-1/2 z-10 flex flex-col items-center">
            <div class="bg-gray-900 text-white text-[10px] font-bold px-3 py-1 rounded-full shadow-lg mb-1">Pickup Location</div>
            <div class="w-5 h-5 rounded-full bg-green-500 border-2 border-white pulse-dot"></div>
            <div class="w-1 h-8 bg-gray-900"></div>
            <div class="w-2 h-1 bg-gray-900 rounded-full blur-[1px]"></div>
        </div>

        <!-- Booking Interface Panel -->
        <div class="absolute bottom-0 w-full bg-white rounded-t-3xl shadow-[0_-10px_20px_rgba(0,0,0,0.1)] z-20 overflow-hidden flex flex-col" style="max-height: 70vh;">
            <div class="w-12 h-1.5 bg-gray-300 rounded-full mx-auto my-3"></div>
            
            <div class="px-5 pb-6 overflow-y-auto">
                <h2 class="text-xl font-black text-gray-900 mb-4">Book a Ride</h2>
                
                <!-- Inputs -->
                <div class="relative pl-8 mb-5">
                    <div class="absolute left-2 top-3 w-3 h-3 rounded-full bg-green-500"></div>
                    <div class="absolute left-3 top-7 w-0.5 h-6 bg-gray-300"></div>
                    <div class="absolute left-2 top-[52px] w-3 h-3 rounded-sm bg-red-500"></div>

                    <div class="relative">
                        <input type="text" id="cab-pickup" placeholder="Current Location" value="My Live Location" class="w-full bg-gray-100 border-none rounded-lg py-2.5 px-4 mb-3 text-sm font-semibold text-gray-800 outline-none focus:ring-2 focus:ring-apex-purple pr-10">
                        <button type="button" onclick="locateMe()" class="absolute right-2 top-1.5 text-apex-purple bg-white shadow-sm p-1.5 rounded-md hover:bg-purple-50 transition-colors" title="Locate Me"><i class="fa-solid fa-location-crosshairs"></i></button>
                    </div>
                    <input type="text" placeholder="Where to?" class="w-full bg-gray-100 border-none rounded-lg py-2.5 px-4 text-sm font-semibold text-gray-800 outline-none focus:ring-2 focus:ring-apex-purple">
                </div>

                <!-- Slots -->
                <div class="flex items-center gap-3 mb-5">
                    <div class="bg-purple-50 text-purple-700 px-3 py-2 rounded-lg flex-1 flex items-center justify-center gap-2 font-bold text-xs cursor-pointer border border-purple-200">
                        <i class="fa-solid fa-clock"></i> Leave Now
                    </div>
                    <div class="bg-gray-50 text-gray-600 px-3 py-2 rounded-lg flex-1 flex items-center justify-center gap-2 font-bold text-xs cursor-pointer border border-gray-200">
                        <i class="fa-solid fa-calendar-alt"></i> Schedule
                    </div>
                </div>

                <!-- Vehicles -->
                <div class="space-y-3 mb-5">
                    <label class="flex items-center justify-between p-3 rounded-xl border-2 border-apex-purple bg-purple-50 cursor-pointer">
                        <div class="flex items-center gap-3">
                            <img src="https://img.icons8.com/color/48/sedan.png" alt="Sedan" class="w-10">
                            <div>
                                <div class="font-bold text-sm text-gray-900">APEX Mini</div>
                                <div class="text-[9px] text-gray-500">4 mins away • 4 seats</div>
                            </div>
                        </div>
                        <div class="font-black text-lg text-gray-900">&#8377;120</div>
                    </label>
                    <label class="flex items-center justify-between p-3 rounded-xl border border-gray-100 bg-white cursor-pointer hover:bg-gray-50">
                        <div class="flex items-center gap-3">
                            <img src="https://img.icons8.com/color/48/suv.png" alt="SUV" class="w-10">
                            <div>
                                <div class="font-bold text-sm text-gray-900">APEX XL</div>
                                <div class="text-[9px] text-gray-500">7 mins away • 6 seats</div>
                            </div>
                        </div>
                        <div class="font-black text-lg text-gray-900">&#8377;180</div>
                    </label>
                </div>

                <button id="cab-btn" onclick="bookCab()" class="w-full bg-gray-900 text-white font-bold py-3.5 rounded-xl shadow-lg hover:bg-black transition-colors text-sm">
                    Book APEX Mini
                </button>
            </div>
        </div>
    </div>


    <!-- BUS SECTION -->
    <div id="content-bus" class="tab-content pt-[110px] px-4 pb-10">
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5 mb-5">
            <h2 class="text-lg font-black text-gray-900 mb-4"><i class="fa-solid fa-bus text-orange-500 mr-2"></i>Bus Booking</h2>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-[10px] font-bold text-gray-500 mb-1">Starting Location</label>
                    <div class="relative">
                        <i class="fa-solid fa-location-dot absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        <input type="text" placeholder="From City" class="w-full bg-gray-50 border border-gray-200 rounded-lg py-2.5 pl-9 pr-3 text-sm focus:outline-none focus:border-orange-500">
                    </div>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-500 mb-1">Destination</label>
                    <div class="relative">
                        <i class="fa-solid fa-location-crosshairs absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        <input type="text" placeholder="To City" class="w-full bg-gray-50 border border-gray-200 rounded-lg py-2.5 pl-9 pr-3 text-sm focus:outline-none focus:border-orange-500">
                    </div>
                </div>
                <div class="flex gap-3">
                    <div class="flex-1">
                        <label class="block text-[10px] font-bold text-gray-500 mb-1">Date</label>
                        <input type="date" class="w-full bg-gray-50 border border-gray-200 rounded-lg py-2.5 px-3 text-sm focus:outline-none focus:border-orange-500">
                    </div>
                    <div class="flex-1">
                        <label class="block text-[10px] font-bold text-gray-500 mb-1">Time</label>
                        <input type="time" class="w-full bg-gray-50 border border-gray-200 rounded-lg py-2.5 px-3 text-sm focus:outline-none focus:border-orange-500">
                    </div>
                </div>
                
                <div class="flex items-center justify-between bg-orange-50 p-3 rounded-lg border border-orange-100 mt-2">
                    <div>
                        <div class="font-bold text-xs text-orange-800">Set Booking Alerts</div>
                        <div class="text-[9px] text-orange-600">Get notified when seats open up</div>
                    </div>
                    <label class="relative inline-flex items-center cursor-pointer">
                      <input type="checkbox" value="" class="sr-only peer">
                      <div class="w-9 h-5 bg-gray-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-orange-500"></div>
                    </label>
                </div>

                <button onclick="simulateSearch(this, 'Buses')" class="w-full bg-orange-600 text-white font-bold py-3.5 rounded-xl shadow-lg hover:bg-orange-700 transition-colors text-sm mt-4">
                    Search Buses
                </button>
            </div>
        </div>
    </div>

    <!-- TRAIN SECTION -->
    <div id="content-train" class="tab-content pt-[110px] px-4 pb-10">
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5 mb-5">
            <h2 class="text-lg font-black text-gray-900 mb-4"><i class="fa-solid fa-train text-blue-500 mr-2"></i>Train Booking</h2>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-[10px] font-bold text-gray-500 mb-1">Starting Station</label>
                    <div class="relative">
                        <i class="fa-solid fa-train-subway absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        <input type="text" placeholder="From Station" class="w-full bg-gray-50 border border-gray-200 rounded-lg py-2.5 pl-9 pr-3 text-sm focus:outline-none focus:border-blue-500">
                    </div>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-500 mb-1">Destination Station</label>
                    <div class="relative">
                        <i class="fa-solid fa-location-crosshairs absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        <input type="text" placeholder="To Station" class="w-full bg-gray-50 border border-gray-200 rounded-lg py-2.5 pl-9 pr-3 text-sm focus:outline-none focus:border-blue-500">
                    </div>
                </div>
                <div class="flex gap-3">
                    <div class="flex-1">
                        <label class="block text-[10px] font-bold text-gray-500 mb-1">Journey Date</label>
                        <input type="date" class="w-full bg-gray-50 border border-gray-200 rounded-lg py-2.5 px-3 text-sm focus:outline-none focus:border-blue-500">
                    </div>
                    <div class="w-1/3">
                        <label class="block text-[10px] font-bold text-gray-500 mb-1">Class</label>
                        <select class="w-full bg-gray-50 border border-gray-200 rounded-lg py-2.5 px-3 text-sm focus:outline-none focus:border-blue-500">
                            <option>All</option>
                            <option>SL</option>
                            <option>3A</option>
                            <option>2A</option>
                            <option>1A</option>
                        </select>
                    </div>
                </div>
                
                <div class="flex items-center justify-between bg-blue-50 p-3 rounded-lg border border-blue-100 mt-2">
                    <div>
                        <div class="font-bold text-xs text-blue-800">Train Availability Alerts</div>
                        <div class="text-[9px] text-blue-600">Notify me if waitlist clears</div>
                    </div>
                    <label class="relative inline-flex items-center cursor-pointer">
                      <input type="checkbox" value="" class="sr-only peer">
                      <div class="w-9 h-5 bg-gray-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-blue-500"></div>
                    </label>
                </div>

                <button onclick="simulateSearch(this, 'Trains')" class="w-full bg-red-600 text-white font-bold py-3.5 rounded-xl shadow-lg hover:bg-red-700 transition-colors text-sm mt-4">
                    Search Trains
                </button>
            </div>
        </div>
    </div>

    <!-- FLIGHT SECTION -->
    <div id="content-flight" class="tab-content pt-[110px] px-4 pb-10">
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5 mb-5">
            <h2 class="text-lg font-black text-gray-900 mb-4"><i class="fa-solid fa-plane-departure text-purple-600 mr-2"></i>Flight Booking</h2>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-[10px] font-bold text-gray-500 mb-1">From Airport</label>
                    <div class="relative">
                        <i class="fa-solid fa-plane-departure absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        <input type="text" placeholder="DEL - New Delhi" class="w-full bg-gray-50 border border-gray-200 rounded-lg py-2.5 pl-9 pr-3 text-sm focus:outline-none focus:border-purple-500">
                    </div>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-500 mb-1">To Airport</label>
                    <div class="relative">
                        <i class="fa-solid fa-plane-arrival absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        <input type="text" placeholder="BOM - Mumbai" class="w-full bg-gray-50 border border-gray-200 rounded-lg py-2.5 pl-9 pr-3 text-sm focus:outline-none focus:border-purple-500">
                    </div>
                </div>
                <div class="flex gap-3">
                    <div class="flex-1">
                        <label class="block text-[10px] font-bold text-gray-500 mb-1">Departure</label>
                        <input type="date" class="w-full bg-gray-50 border border-gray-200 rounded-lg py-2.5 px-3 text-sm focus:outline-none focus:border-purple-500">
                    </div>
                    <div class="flex-1">
                        <label class="block text-[10px] font-bold text-gray-500 mb-1">Return</label>
                        <input type="date" class="w-full bg-gray-50 border border-gray-200 rounded-lg py-2.5 px-3 text-sm focus:outline-none focus:border-purple-500">
                    </div>
                </div>
                
                <div class="flex items-center justify-between bg-purple-50 p-3 rounded-lg border border-purple-100 mt-2">
                    <div>
                        <div class="font-bold text-xs text-purple-800">Fare Drop Alerts</div>
                        <div class="text-[9px] text-purple-600">Track prices for this route</div>
                    </div>
                    <label class="relative inline-flex items-center cursor-pointer">
                      <input type="checkbox" value="" class="sr-only peer" checked>
                      <div class="w-9 h-5 bg-gray-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-purple-500"></div>
                    </label>
                </div>

                <button onclick="simulateSearch(this, 'Flights')" class="w-full bg-purple-600 text-white font-bold py-3.5 rounded-xl shadow-lg hover:bg-purple-700 transition-colors text-sm mt-4">
                    Search Flights
                </button>
            </div>
        </div>
    </div>

</div>
</body>
</html>
