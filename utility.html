<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utility | APEX</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .scrollbar-none::-webkit-scrollbar { display: none; }
        .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { apex: { purple: '#6C3FC5', purplelight: '#EDE9FF', green: '#16a34a' } }, fontFamily: { sans: ['Inter', 'sans-serif'] } }
            }
        }
    </script>
</head>
<body class="font-sans antialiased bg-slate-900 flex justify-center">
<div class="w-full max-w-md bg-[#F4F6FB] min-h-screen relative shadow-2xl overflow-x-hidden border-x border-slate-800 pb-20">
    
    <!-- HEADER -->
    <div class="sticky top-0 z-50 bg-white border-b border-gray-100 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <a href="index.html" class="w-8 h-8 rounded-full bg-gray-50 flex items-center justify-center text-gray-600 hover:bg-gray-100 transition-colors">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <h1 class="font-black text-lg text-gray-900">APEX Pay</h1>
        </div>
        <button class="w-8 h-8 rounded-full bg-teal-50 text-teal-600 flex items-center justify-center">
            <i class="fa-solid fa-qrcode"></i>
        </button>
    </div>

    <!-- HERO DASHBOARD (PENDING BILLS) -->
    <div class="p-4">
        <div class="bg-gradient-to-br from-teal-600 to-cyan-700 rounded-2xl p-5 text-white shadow-lg relative overflow-hidden flex items-center">
            <div class="absolute right-0 top-0 opacity-10">
                <i class="fa-solid fa-file-invoice text-[120px] -mt-4 -mr-4"></i>
            </div>
            <div class="relative z-10 w-full">
                <div class="flex items-center justify-between mb-2">
                    <p class="text-teal-100 text-[10px] font-bold uppercase tracking-widest">Pending Bills (1)</p>
                    <span class="bg-red-500 text-white text-[8px] px-2 py-0.5 rounded font-bold uppercase tracking-wider animate-pulse">Due Today</span>
                </div>
                
                <div class="bg-white/10 backdrop-blur-sm rounded-xl p-3 border border-white/20 mb-3 flex justify-between items-center">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 bg-white rounded-full flex items-center justify-center text-teal-600">
                            <i class="fa-solid fa-bolt"></i>
                        </div>
                        <div>
                            <h4 class="font-bold text-xs">BESCOM Electricity</h4>
                            <p class="text-[9px] text-teal-100">Acc: 83920194</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <h4 class="font-black text-sm">&#8377;1,240</h4>
                        <button class="bg-white text-teal-700 text-[9px] font-black px-3 py-1 rounded shadow-sm mt-1">PAY</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- CATEGORY GRID -->
    <div class="px-4 mb-5">
        <h3 class="text-xs font-black text-gray-400 uppercase tracking-wider mb-3">Recharge & Pay Bills</h3>
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
            <div class="grid grid-cols-4 gap-y-4 gap-x-2">
                <button class="flex flex-col items-center text-center gap-1.5 hover:scale-105 active:scale-95 transition-transform">
                    <div class="w-10 h-10 rounded-full bg-blue-50 text-blue-600 text-lg flex items-center justify-center"><i class="fa-solid fa-mobile-screen"></i></div>
                    <span class="text-[9px] font-bold text-gray-600">Mobile</span>
                </button>
                <button class="flex flex-col items-center text-center gap-1.5 hover:scale-105 active:scale-95 transition-transform">
                    <div class="w-10 h-10 rounded-full bg-yellow-50 text-yellow-600 text-lg flex items-center justify-center"><i class="fa-solid fa-tv"></i></div>
                    <span class="text-[9px] font-bold text-gray-600">DTH</span>
                </button>
                <button class="flex flex-col items-center text-center gap-1.5 hover:scale-105 active:scale-95 transition-transform">
                    <div class="w-10 h-10 rounded-full bg-orange-50 text-orange-600 text-lg flex items-center justify-center"><i class="fa-solid fa-bolt"></i></div>
                    <span class="text-[9px] font-bold text-gray-600">Electricity</span>
                </button>
                <button class="flex flex-col items-center text-center gap-1.5 hover:scale-105 active:scale-95 transition-transform">
                    <div class="w-10 h-10 rounded-full bg-cyan-50 text-cyan-600 text-lg flex items-center justify-center"><i class="fa-solid fa-wifi"></i></div>
                    <span class="text-[9px] font-bold text-gray-600">Broadband</span>
                </button>
                <button class="flex flex-col items-center text-center gap-1.5 hover:scale-105 active:scale-95 transition-transform">
                    <div class="w-10 h-10 rounded-full bg-red-50 text-red-600 text-lg flex items-center justify-center"><i class="fa-solid fa-fire-flame-simple"></i></div>
                    <span class="text-[9px] font-bold text-gray-600">Gas</span>
                </button>
                <button class="flex flex-col items-center text-center gap-1.5 hover:scale-105 active:scale-95 transition-transform">
                    <div class="w-10 h-10 rounded-full bg-blue-50 text-blue-500 text-lg flex items-center justify-center"><i class="fa-solid fa-droplet"></i></div>
                    <span class="text-[9px] font-bold text-gray-600">Water</span>
                </button>
                <button class="flex flex-col items-center text-center gap-1.5 hover:scale-105 active:scale-95 transition-transform">
                    <div class="w-10 h-10 rounded-full bg-purple-50 text-purple-600 text-lg flex items-center justify-center"><i class="fa-solid fa-graduation-cap"></i></div>
                    <span class="text-[9px] font-bold text-gray-600">Education</span>
                </button>
                <button class="flex flex-col items-center text-center gap-1.5 hover:scale-105 active:scale-95 transition-transform">
                    <div class="w-10 h-10 rounded-full bg-gray-100 text-gray-600 text-lg flex items-center justify-center"><i class="fa-solid fa-ellipsis"></i></div>
                    <span class="text-[9px] font-bold text-gray-600">More</span>
                </button>
            </div>
        </div>
    </div>

    <!-- HORIZONTAL TRACK -->
    <div class="mb-5">
        <h3 class="px-4 text-xs font-black text-gray-400 uppercase tracking-wider mb-3">Recent Recharges</h3>
        <div class="flex gap-3 overflow-x-auto px-4 scrollbar-none flex-nowrap pb-2">
            <div class="bg-white rounded-xl p-3 shadow-sm border border-gray-100 min-w-[120px] flex-shrink-0 cursor-pointer flex flex-col items-center text-center">
                <div class="w-10 h-10 rounded-full bg-indigo-50 flex items-center justify-center text-indigo-600 mb-2 font-black text-xs">JIO</div>
                <h4 class="font-bold text-[10px] text-gray-900 truncate w-full">9494273763</h4>
                <p class="text-[9px] text-gray-500 mb-2">Last: &#8377;299</p>
                <button class="w-full bg-teal-50 text-teal-600 font-bold text-[9px] py-1.5 rounded border border-teal-100">Repeat</button>
            </div>
            <div class="bg-white rounded-xl p-3 shadow-sm border border-gray-100 min-w-[120px] flex-shrink-0 cursor-pointer flex flex-col items-center text-center">
                <div class="w-10 h-10 rounded-full bg-red-50 flex items-center justify-center text-red-600 mb-2 font-black text-xs">AIR</div>
                <h4 class="font-bold text-[10px] text-gray-900 truncate w-full">8849201928</h4>
                <p class="text-[9px] text-gray-500 mb-2">Last: &#8377;749</p>
                <button class="w-full bg-teal-50 text-teal-600 font-bold text-[9px] py-1.5 rounded border border-teal-100">Repeat</button>
            </div>
        </div>
    </div>

</div>
</body>
</html>
