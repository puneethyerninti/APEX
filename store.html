<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store | APEX</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .scrollbar-none::-webkit-scrollbar { display: none; }
        .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { apex: { purple: '#6C3FC5', purplelight: '#EDE9FF', green: '#16a34a' } }, fontFamily: { sans: ['Inter', 'sans-serif'] } }
            }
        }
    </script>
</head>
<body class="font-sans antialiased bg-slate-900 flex justify-center">
<div class="w-full max-w-md bg-[#F4F6FB] min-h-screen relative shadow-2xl overflow-x-hidden border-x border-slate-800 pb-20">
    
    <!-- HEADER -->
    <div class="sticky top-0 z-50 bg-white border-b border-gray-100 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <a href="index.html" class="w-8 h-8 rounded-full bg-gray-50 flex items-center justify-center text-gray-600 hover:bg-gray-100 transition-colors">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <h1 class="font-black text-lg text-gray-900">APEX Store</h1>
        </div>
        <div class="flex gap-2">
            <button class="w-8 h-8 rounded-full bg-amber-50 text-amber-600 flex items-center justify-center relative">
                <i class="fa-solid fa-cart-shopping"></i>
                <span id="cart-badge" class="absolute top-0 right-0 w-3.5 h-3.5 bg-red-500 rounded-full border-2 border-white text-[6px] text-white flex items-center justify-center font-bold">0</span>
            </button>
        </div>
    </div>

    <!-- HERO PROMO CAROUSEL -->
    <div class="p-4">
        <div class="bg-gradient-to-r from-amber-500 to-orange-500 rounded-2xl p-5 text-white shadow-lg relative overflow-hidden flex items-center justify-between">
            <div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] opacity-10"></div>
            <div class="relative z-10 w-2/3">
                <p class="text-amber-100 text-[9px] font-bold uppercase tracking-widest mb-1">Big Billion Sale</p>
                <h2 class="text-2xl font-black leading-tight mb-2">Up to 80% Off</h2>
                <button class="bg-white text-orange-600 text-[10px] font-black px-4 py-1.5 rounded-full shadow-sm">Shop Now</button>
            </div>
            <div class="relative z-10 w-1/3 flex justify-end">
                <i class="fa-solid fa-gift text-5xl text-white/90 drop-shadow-md"></i>
            </div>
        </div>
    </div>

    <!-- STORE SEARCH -->
    <div class="px-4 mb-5">
        <div class="relative">
            <i class="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
            <input type="text" oninput="filterStore(this.value)" placeholder="Search for products, brands..." class="w-full bg-white border border-gray-200 rounded-xl pl-9 pr-4 py-2.5 text-xs focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 shadow-sm">
        </div>
    </div>

    <!-- CATEGORY GRID -->
    <div class="px-4 mb-5">
        <div class="grid grid-cols-4 gap-3">
            <button onclick="filterStore('Mobiles')" class="flex flex-col items-center text-center gap-1.5 hover:scale-105 active:scale-95 transition-transform">
                <div class="w-12 h-12 rounded-full bg-blue-100 shadow-sm flex items-center justify-center text-blue-600 text-lg"><i class="fa-solid fa-mobile-screen"></i></div>
                <span class="text-[9px] font-bold text-gray-600">Mobiles</span>
            </button>
            <button onclick="filterStore('Fashion')" class="flex flex-col items-center text-center gap-1.5 hover:scale-105 active:scale-95 transition-transform">
                <div class="w-12 h-12 rounded-full bg-pink-100 shadow-sm flex items-center justify-center text-pink-600 text-lg"><i class="fa-solid fa-shirt"></i></div>
                <span class="text-[9px] font-bold text-gray-600">Fashion</span>
            </button>
            <button onclick="filterStore('Home')" class="flex flex-col items-center text-center gap-1.5 hover:scale-105 active:scale-95 transition-transform">
                <div class="w-12 h-12 rounded-full bg-emerald-100 shadow-sm flex items-center justify-center text-emerald-600 text-lg"><i class="fa-solid fa-couch"></i></div>
                <span class="text-[9px] font-bold text-gray-600">Home</span>
            </button>
            <button onclick="filterStore('Grocery')" class="flex flex-col items-center text-center gap-1.5 hover:scale-105 active:scale-95 transition-transform">
                <div class="w-12 h-12 rounded-full bg-amber-100 shadow-sm flex items-center justify-center text-amber-600 text-lg"><i class="fa-solid fa-basket-shopping"></i></div>
                <span class="text-[9px] font-bold text-gray-600">Grocery</span>
            </button>
        </div>
    </div>

    <!-- HORIZONTAL TRACK -->
    <div class="mb-5">
        <div class="px-4 flex justify-between items-end mb-3">
            <h3 class="text-xs font-black text-gray-400 uppercase tracking-wider">Deals of the Day</h3>
            <a href="#" class="text-[9px] font-bold text-amber-600">View All</a>
        </div>
        <div class="flex gap-3 overflow-x-auto px-4 scrollbar-none flex-nowrap pb-2">
            <div class="product-card bg-white rounded-xl p-3 shadow-sm border border-gray-100 w-[140px] flex-shrink-0 cursor-pointer" data-category="electronics mobiles sony headphones audio">
                <div class="h-24 w-full flex items-center justify-center mb-2">
                    <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&q=80" alt="Product" class="h-full object-contain rounded">
                </div>
                <h4 class="font-bold text-[10px] text-gray-900 truncate mb-1">Sony WH-1000XM4</h4>
                <div class="flex items-end gap-1.5 mb-2">
                    <span class="text-gray-900 font-black text-sm">&#8377;24,990</span>
                    <span class="text-[8px] text-gray-400 line-through">&#8377;29,990</span>
                </div>
                <button onclick="addToCart(this)" class="w-full bg-amber-100 text-amber-700 font-bold text-[9px] py-1.5 rounded-lg hover:bg-amber-200 transition-colors">Add to Cart</button>
            </div>
            <div class="product-card bg-white rounded-xl p-3 shadow-sm border border-gray-100 w-[140px] flex-shrink-0 cursor-pointer" data-category="fashion nike shoes sneakers footwear">
                <div class="h-24 w-full flex items-center justify-center mb-2">
                    <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&q=80" alt="Product" class="h-full object-contain rounded">
                </div>
                <h4 class="font-bold text-[10px] text-gray-900 truncate mb-1">Nike Air Max</h4>
                <div class="flex items-end gap-1.5 mb-2">
                    <span class="text-gray-900 font-black text-sm">&#8377;8,495</span>
                    <span class="text-[8px] text-gray-400 line-through">&#8377;12,995</span>
                </div>
                <button onclick="addToCart(this)" class="w-full bg-amber-100 text-amber-700 font-bold text-[9px] py-1.5 rounded-lg hover:bg-amber-200 transition-colors">Add to Cart</button>
            </div>
        </div>
    </div>

</div>

<script>
    let cartCount = 0;

    function showToast(message) {
        const toast = document.createElement('div');
        toast.className = 'fixed top-10 left-1/2 -translate-x-1/2 bg-gray-900 text-white px-4 py-2 rounded-full text-xs font-bold shadow-lg z-[100] transform transition-all duration-300 opacity-0 translate-y-[-20px]';
        toast.innerHTML = `<i class="fa-solid fa-check-circle mr-2 text-green-400"></i>${message}`;
        document.body.appendChild(toast);
        
        setTimeout(() => {
            toast.classList.remove('opacity-0', 'translate-y-[-20px]');
            toast.classList.add('opacity-100', 'translate-y-0');
        }, 10);
        
        setTimeout(() => {
            toast.classList.remove('opacity-100', 'translate-y-0');
            toast.classList.add('opacity-0', 'translate-y-[-20px]');
            setTimeout(() => toast.remove(), 300);
        }, 2000);
    }

    function addToCart(btn) {
        cartCount++;
        const badge = document.getElementById('cart-badge');
        badge.innerText = cartCount;
        
        // Pop animation
        badge.classList.add('scale-150');
        setTimeout(() => badge.classList.remove('scale-150'), 200);

        // Button state change
        const originalText = btn.innerHTML;
        btn.innerHTML = '<i class="fa-solid fa-check mr-1"></i> Added';
        btn.classList.add('bg-green-100', 'text-green-700');
        btn.classList.remove('bg-amber-100', 'text-amber-700');
        
        showToast("Item added to your cart!");

        setTimeout(() => {
            btn.innerHTML = originalText;
            btn.classList.remove('bg-green-100', 'text-green-700');
            btn.classList.add('bg-amber-100', 'text-amber-700');
        }, 2000);
    }

    function filterStore(query) {
        query = query.toLowerCase();
        const cards = document.querySelectorAll('.product-card');
        
        let found = false;
        cards.forEach(card => {
            const data = card.getAttribute('data-category');
            if (data.includes(query) || query === '') {
                card.style.display = 'block';
                found = true;
            } else {
                card.style.display = 'none';
            }
        });

        if (!found && query !== '') {
            showToast("No products found for '" + query + "'");
        } else if (query !== '') {
            showToast("Showing results for '" + query + "'");
        }
    }
</script>
</body>
</html>
