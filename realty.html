<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realty | APEX</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .scrollbar-none::-webkit-scrollbar { display: none; }
        .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { apex: { purple: '#6C3FC5', purplelight: '#EDE9FF', green: '#16a34a' } }, fontFamily: { sans: ['Inter', 'sans-serif'] } }
            }
        }
    </script>
</head>
<body class="font-sans antialiased bg-slate-900 flex justify-center">
<div class="w-full max-w-md bg-[#F4F6FB] min-h-screen relative shadow-2xl overflow-x-hidden border-x border-slate-800 pb-20">
    
    <!-- HEADER -->
    <div class="sticky top-0 z-50 bg-white border-b border-gray-100 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <a href="index.html" class="w-8 h-8 rounded-full bg-gray-50 flex items-center justify-center text-gray-600 hover:bg-gray-100 transition-colors">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <h1 class="font-black text-lg text-gray-900">APEX Realty</h1>
        </div>
        <button class="w-8 h-8 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center">
            <i class="fa-solid fa-heart"></i>
        </button>
    </div>

    <!-- HERO SEARCH -->
    <div class="relative bg-emerald-900 pt-8 pb-12 px-4 overflow-hidden rounded-b-3xl shadow-md">
        <!-- Background Image overlay -->
        <div class="absolute inset-0 z-0 opacity-20 bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1512917774080-9991f1c4c750?auto=format&fit=crop&q=80');"></div>
        
        <div class="relative z-10">
            <h2 class="text-white text-xl font-black mb-1">Find your dream home</h2>
            <p class="text-emerald-100 text-xs mb-4">Over 10,000+ premium properties.</p>
            
            <div class="bg-white p-2 rounded-2xl shadow-lg">
                <div class="flex border-b border-gray-100 mb-2">
                    <button class="flex-1 py-1.5 text-xs font-bold text-emerald-600 border-b-2 border-emerald-600">Buy</button>
                    <button class="flex-1 py-1.5 text-xs font-bold text-gray-400 hover:text-emerald-600">Rent</button>
                    <button class="flex-1 py-1.5 text-xs font-bold text-gray-400 hover:text-emerald-600">Projects</button>
                </div>
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-gray-400 text-xs"></i>
                    <input type="text" oninput="filterRealty(this.value)" placeholder="Search City, Locality or Landmark" class="w-full bg-gray-50 border border-gray-100 rounded-xl pl-8 pr-4 py-2 text-xs focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500">
                </div>
            </div>
        </div>
    </div>

    <!-- CATEGORY GRID -->
    <div class="px-4 mt-6 mb-6">
        <h3 class="text-xs font-black text-gray-400 uppercase tracking-wider mb-3">Explore Properties</h3>
        <div class="grid grid-cols-4 gap-3">
            <button onclick="filterRealty('Apartment')" class="flex flex-col items-center text-center gap-1.5 hover:scale-105 active:scale-95 transition-transform">
                <div class="w-12 h-12 rounded-xl bg-white border border-gray-100 shadow-sm flex items-center justify-center text-emerald-600 text-lg"><i class="fa-solid fa-building"></i></div>
                <span class="text-[9px] font-bold text-gray-600">Apartments</span>
            </button>
            <button onclick="filterRealty('Villa')" class="flex flex-col items-center text-center gap-1.5 hover:scale-105 active:scale-95 transition-transform">
                <div class="w-12 h-12 rounded-xl bg-white border border-gray-100 shadow-sm flex items-center justify-center text-teal-600 text-lg"><i class="fa-solid fa-house-user"></i></div>
                <span class="text-[9px] font-bold text-gray-600">Villas</span>
            </button>
            <button onclick="filterRealty('Plot')" class="flex flex-col items-center text-center gap-1.5 hover:scale-105 active:scale-95 transition-transform">
                <div class="w-12 h-12 rounded-xl bg-white border border-gray-100 shadow-sm flex items-center justify-center text-emerald-600 text-lg"><i class="fa-solid fa-map-location-dot"></i></div>
                <span class="text-[9px] font-bold text-gray-600">Plots</span>
            </button>
            <button onclick="filterRealty('Commercial')" class="flex flex-col items-center text-center gap-1.5 hover:scale-105 active:scale-95 transition-transform">
                <div class="w-12 h-12 rounded-xl bg-white border border-gray-100 shadow-sm flex items-center justify-center text-teal-600 text-lg"><i class="fa-solid fa-city"></i></div>
                <span class="text-[9px] font-bold text-gray-600">Commercial</span>
            </button>
        </div>
    </div>

    <!-- FEATURED TRACK -->
    <div class="mb-5">
        <div class="px-4 flex justify-between items-end mb-3">
            <h3 class="text-xs font-black text-gray-400 uppercase tracking-wider">Premium Collections</h3>
            <a href="#" class="text-[9px] font-bold text-emerald-600">View All</a>
        </div>
        <div class="flex gap-3 overflow-x-auto px-4 scrollbar-none flex-nowrap pb-2">
            <div class="realty-card bg-white rounded-xl shadow-sm border border-gray-100 min-w-[200px] flex-shrink-0 overflow-hidden group cursor-pointer" data-category="villas hyderabad skyline" onclick="viewPropertyDetails(this)">
                <div class="h-28 w-full bg-gray-200 overflow-hidden relative">
                    <img src="https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?auto=format&fit=crop&q=80" alt="Villa" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500">
                    <span class="absolute top-2 left-2 bg-black/60 text-white text-[8px] font-bold px-2 py-0.5 rounded uppercase tracking-wider">Verified</span>
                </div>
                <div class="p-3">
                    <h4 class="font-black text-xs text-gray-900 truncate mb-1">Skyline Penthouses</h4>
                    <p class="text-[10px] text-gray-500 mb-2 truncate"><i class="fa-solid fa-location-dot text-gray-400 mr-1"></i>Banjara Hills, Hyderabad</p>
                    <div class="flex items-end justify-between">
                        <span class="text-emerald-600 font-black text-sm">&#8377;12.5 Cr</span>
                        <span class="text-[9px] text-gray-400 font-bold">4 BHK</span>
                    </div>
                </div>
            </div>
            <div class="realty-card bg-white rounded-xl shadow-sm border border-gray-100 min-w-[200px] flex-shrink-0 overflow-hidden group cursor-pointer" data-category="apartments bangalore prestige" onclick="viewPropertyDetails(this)">
                <div class="h-28 w-full bg-gray-200 overflow-hidden relative">
                    <img src="https://images.unsplash.com/photo-1545324418-cc1a3fa10c00?auto=format&fit=crop&q=80" alt="Apartment" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500">
                </div>
                <div class="p-3">
                    <h4 class="font-black text-xs text-gray-900 truncate mb-1">Prestige Oasis</h4>
                    <p class="text-[10px] text-gray-500 mb-2 truncate"><i class="fa-solid fa-location-dot text-gray-400 mr-1"></i>Whitefield, Bangalore</p>
                    <div class="flex items-end justify-between">
                        <span class="text-emerald-600 font-black text-sm">&#8377;4.2 Cr</span>
                        <span class="text-[9px] text-gray-400 font-bold">3 BHK</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- STICKY BOTTOM ACTION -->
    <div class="fixed bottom-0 w-full max-w-md bg-white border-t border-gray-100 p-3 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-40">
        <button onclick="postProperty()" class="w-full bg-emerald-600 text-white font-bold py-3 rounded-xl shadow-md hover:bg-emerald-700 transition-colors text-sm">
            Post Property for Free
        </button>
    </div>

</div>

<script>
    function showToast(message) {
        const toast = document.createElement('div');
        toast.className = 'fixed top-10 left-1/2 -translate-x-1/2 bg-gray-900 text-white px-4 py-2 rounded-full text-xs font-bold shadow-lg z-[100] transform transition-all duration-300 opacity-0 translate-y-[-20px]';
        toast.innerHTML = `<i class="fa-solid fa-check-circle mr-2 text-emerald-400"></i>${message}`;
        document.body.appendChild(toast);
        
        setTimeout(() => {
            toast.classList.remove('opacity-0', 'translate-y-[-20px]');
            toast.classList.add('opacity-100', 'translate-y-0');
        }, 10);
        
        setTimeout(() => {
            toast.classList.remove('opacity-100', 'translate-y-0');
            toast.classList.add('opacity-0', 'translate-y-[-20px]');
            setTimeout(() => toast.remove(), 300);
        }, 2500);
    }

    function filterRealty(query) {
        query = query.toLowerCase();
        const cards = document.querySelectorAll('.realty-card');
        
        let found = false;
        cards.forEach(card => {
            const data = card.getAttribute('data-category');
            if (data.includes(query) || query === '') {
                card.style.display = 'block';
                found = true;
            } else {
                card.style.display = 'none';
            }
        });

        if (!found && query !== '') {
            showToast("No properties found for '" + query + "'");
        } else if (query !== '') {
            showToast("Showing properties for '" + query + "'");
        }
    }

    function viewPropertyDetails(card) {
        showToast("Opening property details...");
    }

    function postProperty() {
        showToast("Redirecting to property listing form...");
    }
</script>
</body>
</html>
